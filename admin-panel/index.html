<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churesar One Click - Digital Village</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-green-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">🌿 Churesar One Click</h1>
                <p class="text-xs text-green-200">Digital Gram Panchayat & Community Portal</p>
            </div>
            <a href="../admin-panel/index.html" target="_blank" class="bg-green-800 hover:bg-green-900 text-xs px-3 py-2 rounded font-semibold transition">
                🔐 Admin Login
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="bg-green-800 text-white py-8 px-4 text-center">
        <div class="container mx-auto max-w-2xl">
            <h2 class="text-2xl font-bold mb-2">gaon ki har jankari, ab ek click par!</h2>
            <p class="text-sm text-green-100">Masjid, Committee, Vikas Karya, Funds aur Kabristan ki sabhi update yahan dekhein.</p>
        </div>
    </section>

    <!-- Main Container -->
    <main class="container mx-auto p-4 max-w-4xl my-4">
        
        <!-- Category Filter Buttons -->
        <div class="mb-6 flex flex-wrap gap-2 justify-center">
            <button onclick="filterCategory('All')" class="category-btn bg-green-700 text-white px-3 py-1.5 rounded-full text-xs font-bold transition shadow">Sabhi (All)</button>
            <button onclick="filterCategory('Masjid & Madarsa')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Masjid & Madarsa</button>
            <button onclick="filterCategory('Committee')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Committee</button>
            <button onclick="filterCategory('Fund & Donation')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Fund & Donation</button>
            <button onclick="filterCategory('Vikas Karya')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Vikas Karya</button>
            <button onclick="filterCategory('Kabristan')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Kabristan</button>
            <button onclick="filterCategory('Education')" class="category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition">Education</button>
        </div>

        <!-- Records Feed -->
        <div id="publicRecordsList" class="space-y-4">
            <div class="text-center py-10 text-gray-500">Jankari load ho rahi hai...</div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white text-center py-4 mt-12 text-xs">
        <p>© 2026 Churesar One Click | Developed for Digital Village</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'http://localhost:5000/api/records';
        let allRecords = [];

        async function fetchPublicRecords() {
            try {
                const response = await fetch(API_URL);
                const result = await response.json();
                allRecords = result.data || [];
                displayRecords(allRecords);
            } catch (err) {
                console.error('Error fetching records:', err);
                document.getElementById('publicRecordsList').innerHTML = '<p class="text-center text-red-500">Server se connect nahi ho pa raha hai. Kripya backend check karein.</p>';
            }
        }

        function displayRecords(records) {
            const listDiv = document.getElementById('publicRecordsList');
            
            if (records.length === 0) {
                listDiv.innerHTML = '<div class="bg-white p-6 rounded-lg shadow text-center text-gray-500">Filhal is category mein koi record uplabdh nahi hai.</div>';
                return;
            }

            listDiv.innerHTML = '';
            records.forEach(item => {
                listDiv.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-100 hover:shadow-md transition">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs bg-green-100 text-green-800 px-2.5 py-0.5 rounded-full font-bold">${item.category || 'General'}</span>
                            <span class="text-xs text-gray-400">ID: #${item.id}</span>
                        </div>
                        <h3 class="text-lg font-bold text-green-900 mb-1">${item.title}</h3>
                        <p class="text-gray-700 text-sm leading-relaxed">${item.description}</p>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.textContent.includes(category) || (category === 'All' && btn.textContent.includes('Sabhi'))) {
                    btn.className = "category-btn bg-green-700 text-white px-3 py-1.5 rounded-full text-xs font-bold transition shadow";
                } else {
                    btn.className = "category-btn bg-white text-green-800 border border-green-300 px-3 py-1.5 rounded-full text-xs font-semibold hover:bg-green-50 transition";
                }
            });

            if (category === 'All') {
                displayRecords(allRecords);
            } else {
                const filtered = allRecords.filter(item => item.category === category);
                displayRecords(filtered);
            }
        }

        fetchPublicRecords();
    </script>
</body>
</html>
